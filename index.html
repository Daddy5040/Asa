<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😂 Prank</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    color:white;
    font-family:Arial;
}

#main{
    position:relative;
    z-index:10;
    text-align:center;
}

#main img{
    width:350px;
    animation:pulse .5s infinite alternate;
}

h1{
    font-size:3rem;
    text-shadow:0 0 20px red;
}

.gorille{
    position:absolute;
    width:120px;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-200px) rotate(0deg);
    }
    to{
        transform:translateY(120vh) rotate(720deg);
    }
}

@keyframes pulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.1);
    }
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:15px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="main">
    <img src="https://i.pinimg.com/originals/d3/46/99/d346991b34a3ed1f0ef8d1bc96f62a8e.jpg">
    <button onclick="window.close()">
        Retour à la réalité
    </button>
</div>

<script>

function spawnGorille(){

    let img = document.createElement("img");

    img.src="https://i.pinimg.com/originals/d3/46/99/d346991b34a3ed1f0ef8d1bc96f62a8e.jpg";
    img.className="gorille";

    img.style.left=Math.random()*window.innerWidth+"px";
    img.style.animationDuration=
        (Math.random()*3+2)+"s";

    document.body.appendChild(img);

    setTimeout(()=>{
        img.remove();
    },6000);
}

setInterval(spawnGorille,150);

document.title = "⚠️ VIRUS DÉTECTÉ ⚠️";

</script>

</body>
</html>
